# Example configuration. Copy to config.yaml (git ignored) and fill in values.
#   cp config.example.yaml config.yaml
# Never commit config.yaml: it may hold tokens, private links or personal data.

# IANA timezone used for every time shown on every dashboard.
timezone: America/Vancouver

# Per dashboard settings, keyed by dashboard folder name. Each dashboard's
# fetch step receives only its own block. Leave secrets blank here.
dashboards:
  sample:
    # The sample dashboard needs no accounts or network.
    # Set to true to simulate a failed fetch and see the "stale since" note.
    simulate_failure: false

  today:
    # Sections shown on the "today" screen, top to bottom.
    sections: [weather, agenda]
    # false -> no data source credits in the footer. Fine for a private screen;
    # keep true for anything shared or public (Open-Meteo requires credit).
    source_notes: true
    weather:
      latitude:               # decimal degrees, e.g. 12.3456 (keep the real value only in config.yaml)
      longitude:
      temperature_unit: celsius   # celsius | fahrenheit
      wind_unit: kmh              # kmh | ms | mph | kn
      rain_threshold_percent: 20  # show the rain block at or above this probability
      simulate: false             # true -> fake SAMPLE weather, no network
      simulate_rain_percent: 40   # with simulate: peak rain chance (below the threshold -> dry look)
      tomorrow_tags: false        # true -> tags beside the date for what changes tomorrow
      # simulate_tomorrow: {temp: -4, wind: 15, rain: 60}   # with simulate: tomorrow minus today
    agenda:
      style: rows                 # rows (one band per day, then today's to-dos) or columns
      days: 2                     # days shown, today first (default 2 for rows, 3 for columns)
      max_events: 5               # rows: event lines per day, the last becomes "+N more"
      calendars: []               # private .ics addresses (SECRET: keep real ones only in config.yaml)
      todoist_token: ""           # Todoist API token (SECRET)
      todoist_filter: ""          # blank -> "overdue | next 7 days"
      max_tasks: 2                # columns: tasks per day before "…"
      simulate: false             # true -> made up SAMPLE events and tasks, no network

  # example_private_dashboard:
